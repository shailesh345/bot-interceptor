<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Debugging</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .warning { background-color: #fff3cd; color: #856404; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        pre { background-color: #f8f9fa; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔍 Token Debugging</h1>
    
    <button onclick="checkTokenStatus()">Check Token Status</button>
    <button onclick="testDirectAPI()">Test Direct API</button>
    <button onclick="testFrontendAPI()">Test Frontend API</button>
    <button onclick="refreshPage()">Refresh Page</button>
    
    <div id="results"></div>
    
    <script>
        function checkTokenStatus() {
            const resultsDiv = document.getElementById('results');
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');
            
            if (token && user) {
                const userData = JSON.parse(user);
                resultsDiv.innerHTML = `
                    <div class="status success">✅ Token found in localStorage</div>
                    <pre><strong>Token:</strong> ${token.substring(0, 100)}...</pre>
                    <pre><strong>User:</strong> ${userData.username} (${userData.email})</pre>
                    <pre><strong>Token Length:</strong> ${token.length} characters</pre>
                `;
            } else {
                resultsDiv.innerHTML = `
                    <div class="status error">❌ No token found in localStorage</div>
                    <p>Please set up authentication first.</p>
                `;
            }
        }
        
        async function testDirectAPI() {
            const resultsDiv = document.getElementById('results');
            const token = localStorage.getItem('token');
            
            if (!token) {
                resultsDiv.innerHTML = '<div class="status error">❌ No token found</div>';
                return;
            }
            
            try {
                resultsDiv.innerHTML = '<div class="status warning">⏳ Testing direct backend API...</div>';
                
                const response = await fetch('http://127.0.0.1:5000/api/v1/domains', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    resultsDiv.innerHTML = `
                        <div class="status success">✅ Direct API test successful</div>
                        <pre>Response: ${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    const errorText = await response.text();
                    resultsDiv.innerHTML = `
                        <div class="status error">❌ Direct API test failed: ${response.status}</div>
                        <pre>Error: ${errorText}</pre>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="status error">❌ Direct API error: ${error.message}</div>
                `;
            }
        }
        
        async function testFrontendAPI() {
            const resultsDiv = document.getElementById('results');
            const token = localStorage.getItem('token');
            
            if (!token) {
                resultsDiv.innerHTML = '<div class="status error">❌ No token found</div>';
                return;
            }
            
            try {
                resultsDiv.innerHTML = '<div class="status warning">⏳ Testing frontend proxy API...</div>';
                
                const response = await fetch('http://localhost:3000/api/v1/domains', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    resultsDiv.innerHTML = `
                        <div class="status success">✅ Frontend proxy test successful</div>
                        <pre>Response: ${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    const errorText = await response.text();
                    resultsDiv.innerHTML = `
                        <div class="status error">❌ Frontend proxy test failed: ${response.status}</div>
                        <pre>Error: ${errorText}</pre>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="status error">❌ Frontend proxy error: ${error.message}</div>
                `;
            }
        }
        
        function refreshPage() {
            window.location.reload();
        }
        
        // Check token on load
        checkTokenStatus();
    </script>
</body>
</html>
