<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth State Test</title>
</head>
<body>
    <h1>Auth State Test</h1>
    <div id="status"></div>
    <script>
        // Check if token exists in localStorage
        const token = localStorage.getItem('token');
        const userStr = localStorage.getItem('user');
        
        const statusDiv = document.getElementById('status');
        
        if (token && userStr) {
            const user = JSON.parse(userStr);
            statusDiv.innerHTML = `
                <p><strong>Token found:</strong> ${token.substring(0, 50)}...</p>
                <p><strong>User:</strong> ${user.username} (${user.email})</p>
                <p><strong>Tenant ID:</strong> ${user.tenant_id}</p>
                <p><strong>Status:</strong> <span style="color: green;">Authenticated</span></p>
            `;
        } else {
            statusDiv.innerHTML = `
                <p><strong>Status:</strong> <span style="color: red;">Not authenticated</span></p>
                <p>No token or user data found in localStorage</p>
            `;
        }
    </script>
</body>
</html>
