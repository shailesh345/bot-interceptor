version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: traffic_interceptor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Flask Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      - db
      - redis
    environment:
      FLASK_CONFIG: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/traffic_interceptor
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

  # Celery Worker
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A run.celery worker --loglevel=info
    depends_on:
      - db
      - redis
    environment:
      FLASK_CONFIG: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/traffic_interceptor
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    restart: unless-stopped

  # Celery Beat Scheduler
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A run.celery beat --loglevel=info
    depends_on:
      - db
      - redis
    environment:
      FLASK_CONFIG: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/traffic_interceptor
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    name: traffic_interceptor_network
