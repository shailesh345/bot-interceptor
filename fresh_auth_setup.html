<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Fresh Auth Token</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .status { padding: 15px; margin: 10px 0; border-radius: 4px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        button { padding: 12px 20px; margin: 10px 5px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
        pre { background-color: #f8f9fa; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Fresh Authentication Setup</h1>
        
        <div id="status" class="status info">
            Setting up fresh authentication token...
        </div>
        
        <div id="details"></div>
        
        <div style="margin: 20px 0;">
            <button onclick="testDomainsPage()">Test Domains Page</button>
            <button onclick="clearAuth()">Clear Auth</button>
            <button onclick="window.location.reload()">Refresh</button>
        </div>
        
        <div id="test-results"></div>
    </div>
    
    <script>
        // Set up fresh authentication data
        function setupAuth() {
            const token = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJmcmVzaCI6ZmFsc2UsImlhdCI6MTc1MzExOTgyNiwianRpIjoiMjBhMTRjMjMtYzVkMS00Y2VhLTgxZWMtMTZjMTAwN2MzMzYzIiwidHlwZSI6ImFjY2VzcyIsInN1YiI6IjlhMDA1YzMzLTFjM2YtNDIwMS1iZDhlLWVjMGRjYTA2YWNiOCIsIm5iZiI6MTc1MzExOTgyNiwiZXhwIjoxNzUzMjA2MjI2fQ.nyX_3aWys4W-aqDgvnmRe_0FP9xKN0_s_S7yzxFe73g';
            const user = {
                "email": "test@example.com",
                "first_name": "Test",
                "id": "9a005c33-1c3f-4201-bd8e-ec0dca06acb8",
                "last_name": "User",
                "role": "user",
                "tenant_id": "f1b471d7-1cc7-4353-8e71-db7332eae9a0",
                "username": "testuser"
            };
            const refreshToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJmcmVzaCI6ZmFsc2UsImlhdCI6MTc1MzExOTgyNiwianRpIjoiNGU3OWQxNGEtNzc1MC00MWQ3LWE5OTctYmJjNGI1Zjk3YTdhIiwidHlwZSI6InJlZnJlc2giLCJzdWIiOiI5YTAwNWMzMy0xYzNmLTQyMDEtYmQ4ZS1lYzBkY2EwNmFjYjgiLCJuYmYiOjE3NTMxMTk4MjYsImV4cCI6MTc1NTcxMTgyNn0.mChltiUsXohFo17OV1Xe11azxIndV9MMCCi4N1mK5Ks';
            
            // Store in localStorage
            localStorage.setItem('token', token);
            localStorage.setItem('user', JSON.stringify(user));
            localStorage.setItem('refreshToken', refreshToken);
            
            // Update status
            const statusDiv = document.getElementById('status');
            statusDiv.className = 'status success';
            statusDiv.innerHTML = '✅ Fresh authentication token set successfully!';
            
            // Show details
            const detailsDiv = document.getElementById('details');
            detailsDiv.innerHTML = `
                <h3>Authentication Details:</h3>
                <p><strong>User:</strong> ${user.username} (${user.email})</p>
                <p><strong>Role:</strong> ${user.role}</p>
                <p><strong>Tenant ID:</strong> ${user.tenant_id}</p>
                <p><strong>Token:</strong> ${token.substring(0, 50)}...</p>
                <div class="status info">
                    The authentication data has been stored in localStorage.
                    You can now navigate to the domains page.
                </div>
            `;
            
            console.log('Authentication data set in localStorage');
        }
        
        function testDomainsPage() {
            const testResults = document.getElementById('test-results');
            testResults.innerHTML = '<div class="status info">Opening domains page...</div>';
            
            // Open domains page in the same window
            window.open('http://localhost:3000/domains', '_blank');
        }
        
        function clearAuth() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            localStorage.removeItem('refreshToken');
            
            const statusDiv = document.getElementById('status');
            statusDiv.className = 'status info';
            statusDiv.innerHTML = '🗑️ Authentication data cleared';
            
            const detailsDiv = document.getElementById('details');
            detailsDiv.innerHTML = '<p>Authentication data has been cleared from localStorage.</p>';
        }
        
        // Set up auth on page load
        setupAuth();
    </script>
</body>
</html>
